name: backend

on:
  push:
    paths:
      - 'backend/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/backend.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agency
          POSTGRES_PASSWORD: agency
          POSTGRES_DB: agency_os
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agency -d agency_os"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agency-os/shared build
      - run: pnpm --filter @agency-os/api typecheck
      - run: pnpm --filter @agency-os/api lint
      - run: pnpm --filter @agency-os/api test
      # Los invariantes de PLAN.md §4 y los casos de abuso de §9 solo se pueden
      # probar contra Postgres y Redis de verdad. La suite crea su propia base
      # `agency_os_test` a partir de este DATABASE_URL y le aplica las migraciones.
      - run: pnpm --filter @agency-os/api test:integration
        env:
          DATABASE_URL: postgresql://agency:agency@localhost:5432/agency_os
          REDIS_URL: redis://localhost:6379
      - run: pnpm --filter @agency-os/api drizzle-kit check
        env:
          DATABASE_URL: postgresql://agency:agency@localhost:5432/agency_os
