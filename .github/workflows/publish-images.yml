name: publish-images

# Publica las imagenes de produccion en GHCR con la etiqueta del commit.
# El VPS no compila: hace `docker login ghcr.io` y despliega por digest.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agency-os-api
            dockerfile: backend/Dockerfile
            context: .
          - name: agency-os-backup
            dockerfile: deploy/production/backup/Dockerfile
            context: deploy/production/backup
    steps:
      - uses: actions/checkout@v4
      # GHCR exige nombres en minusculas y el owner puede tener mayusculas.
      - id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.owner }}/${{ matrix.name }}:latest

  publish-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web-app/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://erp.globalcompany.company/api/v1' }}
            VITE_EXTENSION_ID=${{ vars.VITE_EXTENSION_ID || 'fcniigapdfcoigmnkhkcgmhlhjdledbo' }}
            VITE_LOCAL_AGENT_URL=${{ vars.VITE_LOCAL_AGENT_URL || 'http://127.0.0.1:45831' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/agency-os-web:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.owner }}/agency-os-web:latest
