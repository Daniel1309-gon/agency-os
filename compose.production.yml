name: agency-os

# Límite de logs en todos los servicios: el VPS tiene disco finito.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agency_os}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    logging: *default-logging
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    image: ${AGENCY_OS_API_IMAGE:?set AGENCY_OS_API_IMAGE}
    logging: *default-logging
    env_file:
      - ./deploy/production/.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      # El scheduler corre una sola vez: en el worker dedicado.
      JOBS_ENABLED: "false"
      # API uses DATABASE_APP_URL. DATABASE_URL remains only for the ops container.
      DATABASE_URL: postgresql://agency@postgres:5432/agency_os
      POSTGRES_PASSWORD: ""
      DATABASE_RUNTIME_PASSWORD: ""
      DATABASE_WORKER_PASSWORD: ""
      BOOTSTRAP_ADMIN_PASSWORD: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    image: ${AGENCY_OS_WEB_IMAGE:?set AGENCY_OS_WEB_IMAGE}
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    logging: *default-logging
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

  # Única entrada pública: el túnel habla con Caddy por HTTP interno. Cloudflare
  # aplica WAF + mTLS de zona y reescribe la cabecera de certificado.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.0
    logging: *default-logging
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      caddy:
        condition: service_started
    networks:
      edge:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

  worker:
    image: ${AGENCY_OS_API_IMAGE:?set AGENCY_OS_API_IMAGE}
    logging: *default-logging
    env_file:
      - ./deploy/production/.env.production
    environment:
      NODE_ENV: production
      DATABASE_RUNTIME_ROLE: worker
      REDIS_URL: redis://redis:6379
      JOBS_ENABLED: "true"
      DATABASE_URL: postgresql://agency@postgres:5432/agency_os
      POSTGRES_PASSWORD: ""
      DATABASE_RUNTIME_PASSWORD: ""
      DATABASE_WORKER_PASSWORD: ""
      BOOTSTRAP_ADMIN_PASSWORD: ""
    command: ["node", "dist/worker-main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      # egress: Rocket.Chat y otras salidas; internal: Postgres/Redis aislados.
      - internal
      - egress
    restart: unless-stopped

  # Dumps cada 30 min, cifrados antes de salir del VPS y subidos a B2 con
  # Object Lock. Corre aparte de la API para no compartir destino de fallo.
  backup:
    profiles: ["backup"]
    image: ${AGENCY_OS_BACKUP_IMAGE:?set AGENCY_OS_BACKUP_IMAGE}
    logging: *default-logging
    env_file:
      - ./deploy/production/.env.production
    environment:
      BACKUP_WORKDIR: /var/lib/agency-os-backup
      FREQUENT_RETENTION_HOURS: "24"
      DAILY_RETENTION_DAYS: "30"
      MAX_AGE_MINUTES: "45"
    volumes:
      - backup_status:/var/lib/agency-os-backup
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # egress: subida a B2 y heartbeat; internal: solo Postgres.
      - internal
      - egress
    restart: unless-stopped

  ops:
    profiles: ["ops"]
    image: ${AGENCY_OS_API_IMAGE:?set AGENCY_OS_API_IMAGE}
    logging: *default-logging
    env_file:
      - ./deploy/production/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    command: ["node", "scripts/db-migrate.mjs"]

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  backup_status:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  # Salida a Internet para worker (Rocket.Chat) y backup (B2, heartbeat).
  # No da acceso a Postgres/Redis: esos solo están en `internal`.
  egress:
    ipam:
      config:
        - subnet: 172.31.0.0/24
