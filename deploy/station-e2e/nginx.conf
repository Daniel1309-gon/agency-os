map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream agency_api {
  server api-a:3000 max_fails=2 fail_timeout=5s;
  server api-b:3000 max_fails=2 fail_timeout=5s;
  keepalive 32;
}

server {
  listen 443 ssl default_server;
  server_name app.agency-os.test;

  ssl_certificate /run/secrets/tls_certificate;
  ssl_certificate_key /run/secrets/tls_private_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /extension/ {
    alias /srv/extension/;
    autoindex off;
    add_header Cache-Control "no-store" always;
    types {
      application/xml xml;
      application/x-chrome-extension crx;
    }
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl;
  server_name api.agency-os.test;

  ssl_certificate /run/secrets/tls_certificate;
  ssl_certificate_key /run/secrets/tls_private_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 256k;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    proxy_pass http://agency_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
  }
}

