packages:
  - "backend"
  - "web-app"
  - "packages/*"
overrides:
  js-yaml: ^5.4.1
  ajv>fast-uri: 3.1.8
  '@fastify/ajv-compiler>fast-uri': 4.1.5
  fast-json-stringify>fast-uri: 4.1.5
  '@nestjs/platform-fastify>fastify': 5.12.5
# Temporary audit exceptions. Each one is registered with its reason and expiry in
# docs/security/audit-exceptions.json; tools/audit-exceptions.test.mjs fails once it expires.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
